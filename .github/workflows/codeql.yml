# gate-14-codeql — CodeQL at full potential.
#
# Owner directive 2026-11-05: "use CodeQL full potential" (CodeQL
# zero-to-hero series + code-quality docs). Everything the GitHub action
# exposes, wired in and locally validated:
#
#   * query suites: security-extended AND security-and-quality — the
#     widest shipped coverage (extra CWE breadth + maintainability/
#     reliability rules), not just the default security suite.
#   * custom J2R invariant queries (analysis/codeql/, zero-to-hero
#     part-2/3 applied to a compiler project):
#       - UnsafeCode.ql   safe-Rust-only law: unsafe fn/impl, inline asm,
#                         #[unsafe(...)] as a semantic second net under
#                         gate-10 (plain `unsafe {}` stays covered by the
#                         forbid attribute + gate-10 grep; see the query's
#                         docstring for why blocks are out of scope here).
#       - StdoutPrint.ql  differential-exactness law: no println!/print!
#                         in the runtime/codegen crates — output must stay
#                         byte-identical vs Temurin (gates 3/9).
#     Both queries were validated locally with CodeQL CLI 2.27.4 before
#     landing: clean compile, positive controls fire on a known-bad
#     fixture DB, zero findings on the real repo DB.
#   * dependency-caching — CodeQL pack cache (faster, cheaper runs).
#   * workflow_dispatch — on-demand runs for triage/variant analysis.
#   * category "/language:rust" — diffable results on pull requests.
#   * action v4, pinned by commit SHA (same supply-chain policy as ci.yml).
#
# Rust caveat (honest): GitHub's rule-based Code Quality dashboard
# languages are currently C#, Go, Java, JavaScript, Python, Ruby,
# TypeScript — Rust is not in that list yet, so the maintainability/
# reliability cards of the Code Quality view may stay sparse until GitHub
# ships Rust quality rules. Everything else (code scanning alerts,
# security overview, PR annotations, this workflow's suites) is live for
# Rust today.
#
# `build-mode: none` — CodeQL's Rust analysis without an explicit build;
# the workspace is a plain cargo tree, which is exactly the shape it
# handles. Runs in its own workflow because CodeQL maintains its own
# queue and its findings land in GitHub Security rather than the gate-8
# aggregate — but it is still a numbered gate in the project register
# (gate-14; 13 is reserved for the M4 Wave-4 concurrency gate), and a red
# CodeQL run is treated like any other red gate: fix before the next wave.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:23 UTC — catches new query packs even when the
    # code is quiet.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: gate-14-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: rust
          build-mode: none
          dependency-caching: true
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:rust"
