name: CI

# Gate upgrade package (2026-11-04, "improve the gates"):
#   * least-privilege: workflow-level `permissions: contents: read`
#   * PR runs cancel superseded runs; main keeps EVERY run (evidence chain)
#   * per-job `timeout-minutes` — a hang fails loudly instead of burning
#     runner hours and showing as "in progress" forever
#   * toolchains pinned to the exact versions used for local evidence
#     (rust 1.99.1, Temurin 21.0.13): CI reproduces local, no drift — a
#     push that passed locally cannot fail because GitHub's "stable" moved
#   * third-party actions pinned by commit SHA (supply-chain hardening)
#   * `--locked` on every workspace cargo invocation (reproducible
#     resolution; Cargo.lock is committed)
#   * NEW gate-12-runtime-seams — M4_PLAN §2 R3's promised CI grep for
#     unannotated `thread_local!`, now a visible named gate covering all
#     four crates (incl. codegen emission templates) with a printed census
#   * gate-5 upgraded: proves a real 302-line multi-class program (BigRpg,
#     8 classes) through the standalone offline path, not a 34-line probe
#   * gate-9 re-architected (2026-11-05): the gc-stress suite
#     (J2R_GC_EVERY_N=1, a collection at every allocation) outgrew its
#     60-minute runner cap after Wave 3 pushed the fixture census — the
#     three runs after 98be983 (e5b152c, d302c2b, 50e0ed6) died at
#     exactly 60m15s; stride sharding then failed twice on its own caps
#     (4-way e9f81ac, 6-way CI #59) because it balances fixture counts,
#     not durations. The gc-probe diagnostic localized the real bombs
#     (ReflectGC ~14m CI; MonitorContention/WaitNotify CI-timing
#     protocol race at N=1) and gate-9 now runs DURATION-BALANCED
#     buckets (solo / monitors / heavy / light-0..2) with the policy
#     in the harness, unit-tested as a full partition (see the job
#     comment). The monitors bucket's temporary N=8 ended 2026-11-05:
#     the T17 races are fixed and all six legs run the uniform N=1.
#
# Gate numbering: 1 fmt, 2 clippy, 3 jvm-differential, 4 build-release,
# 5 standalone, 6 doc-lint, 7 security-audit, 8 aggregate, 9 gc-stress
# (duration-balanced 6-leg bucket matrix, J2R_DIFF_BUCKET, 40-min cap),
# 10 no-unsafe, 11 doc-counts, 12 runtime-seams, 13 concurrency (coop
# differential × 4 seeds + chaos stress, 25-min cap — M4_PLAN §3 Wave 4,
# landed 2026-11-05); gate 14
# = CodeQL security & quality (codeql.yml, own workflow + Security tab);
# gate 15 = OSSF Scorecard supply-chain posture (scorecard.yml, own
# workflow, Security tab); gate 16 = OSV dependency scan (osv.yml, own
# workflow, Security tab). 15/16 added 2026-11-05 from the owner's
# Security-settings review — first-party, zero-credential scanners that
# publish SARIF alerts; like gate-14 they sit outside the gate-8
# aggregate, and a red run is a stop-the-wave event. Gate 9 bucket
# policy: diff_suite.rs bucket_for_gate9 (harness-owned, unit-tested
# partition; the monitors bucket is back at N=1 since the T17 race fix
# 6b6b7e3).
#
# Gate-upgrade package 2 (2026-11-06, master-ci-inspired, owner directive
# "customize it and add and improve our current gates — do not delete"):
#   * gate-17-supply-chain — cargo-deny (license compliance, duplicate
#     versions, source-registry pinning; advisories stay gate-7's policy)
#     + gitleaks secret scan (every push/PR, and the full history is
#     scanned locally: 93 commits, no leaks, 2026-11-06)
#   * gate-18-actions-security — zizmor (workflow security audit) +
#     actionlint (workflow syntax/semantics): the review's "protect
#     against shell injection and unsafe expression interpolation"
#   * gate-19-doc-links — every local link and anchor in the repo's
#     markdown resolves (deterministic: external URLs are NOT checked,
#     that class belongs to a scheduled advisory job)
#   * gate-20-code-integrity — deterministic stub/elision markers
#     (todo!(), unimplemented!(), "... existing code ...", FIXME): the
#     master-ci "blocking-grade rules only" model, zero-FP by birth scan
#   * gate-21-dependency-hygiene — cargo-machete unused-dependency
#     report, ADVISORY by design (continue-on-error): it can miss
#     macro-only usage, so it reports and never blocks; promotion to
#     blocking needs a green history and an owner decision
#   * `changes` path filter — prose-only PRs skip the five heavy
#     compile-and-run legs (gates 3/4/5/9/13) on pull_request ONLY;
#     pushes to main always run everything (evidence chain). The filter
#     fails OPEN on any uncertainty and its edge-case table is pinned by
#     scripts/path_filter.py --selftest, which runs inside the changes
#     job on every invocation (the review's "path-filter regression
#     tests" requirement)
#   * every checkout now sets persist-credentials: false (zizmor
#     artipacked audit, 14 findings, all fixed): CI never pushes, so
#     the runner keeps no long-lived GITHUB_TOKEN in .git/config

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: path-filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filt.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Filter selftest (edge-case table pinned — the review's path-filter regression suite)
        run: python3 scripts/path_filter.py --selftest
      - id: filt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/path_filter.py >> "$GITHUB_OUTPUT"

  fmt:
    name: gate-1-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Formatting (rustfmt, zero tolerance)
        run: cargo fmt --all -- --check

  clippy:
    name: gate-2-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy (all targets, all features, warnings are errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: gate-3-test-jvm-differential
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Tests (unit + e2e + differential suite vs real JVM)
        run: cargo test --workspace --all-features --locked

  build-release:
    name: gate-4-build-release
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clean release build
        run: cargo build --release --locked

  standalone:
    name: gate-5-standalone-generated-crate
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # generated code may warn; the compiler itself is still gated by jobs 1-4
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Build j2r
        run: cargo build --release --locked
      - name: Compile a real multi-class fixture (BigRpg, 8 classes) to a Rust crate
        run: |
          javac -d /tmp/st crates/j2r-cli/tests/suite/BigRpg.java
          ./target/release/j2r compile /tmp/st/BigRpg*.class --main-class BigRpg --crate-name j2r_app -o /tmp/st/out
      - name: Build the generated crate away from this workspace (offline)
        run: |
          cp -r /tmp/st/out "$RUNNER_TEMP/isolated-app"
          cargo build --release --offline --manifest-path "$RUNNER_TEMP/isolated-app/Cargo.toml"
      - name: Run the standalone native binary
        run: '"$RUNNER_TEMP/isolated-app/target/release/j2r_app"'

  doc:
    name: gate-6-doc-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Docs build without warnings
        run: cargo doc --no-deps --locked

  security:
    name: gate-7-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-audit
      - name: RustSec audit (any advisory fails the gate)
        run: cargo audit

  gc-stress:
    name: gate-9-gc-stress-forced-collection
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Duration-balanced BUCKETS (2026-11-05, replaces stride sharding).
    # Stride failed twice on its own caps (4-way e9f81ac: 24m/>=90m/>=90m/1m;
    # 6-way CI #59: 14m/1m/>=120m/1m/1m/>=120m) because it balances fixture
    # COUNTS, not durations. The gc-probe diagnostic (rounds #1/#2) then
    # localized the real bombs: ReflectGC completes on CI in ~14m at N=1;
    # MonitorContention and WaitNotify hit a timing-sensitive Wave-3
    # protocol race on slow 2-vCPU runners at N=1 (2/2 and 1/2 hangs)
    # but finish in under a minute at N=8. The bucket policy lives in the
    # harness (diff_suite.rs bucket_for_gate9 + the partition unit test):
    # solo / monitors(N=8) / heavy / light-0..2, re-derived from the suite
    # directory so a new fixture can never fall between legs. The monitor
    # race itself is the Wave-4 stress task's first case.
    timeout-minutes: 40
    strategy:
      # A collection at every allocation over the full suite no longer
      # fits one runner's cap; every bucket still asserts the full
      # on-disk census (diff_suite guard), so a bucket can never
      # silently skip work. All six legs must pass for the gate to be
      # green.
      fail-fast: false
      matrix:
        bucket:
          - { name: solo, gcn: 1 }
          - { name: monitors, gcn: 1 }
          - { name: heavy, gcn: 1 }
          - { name: light-0, gcn: 1 }
          - { name: light-1, gcn: 1 }
          - { name: light-2, gcn: 1 }
    env:
      # Forced-GC mode: a collection runs at EVERY collection point (before
      # every allocating opcode), uniformly N=1 across all six legs. The
      # monitors bucket ran at N=8 from 2026-11-05 until the T17 races
      # were fixed (commit 6b6b7e3: the monitor-wait lost-wakeup slice +
      # the coop turn-grant skip); the completion flip back to N=1 is the
      # honest end state — CI validates it, a red leg reverts to N=8 with
      # evidence.
      J2R_GC_EVERY_N: ${{ matrix.bucket.gcn }}
      J2R_DIFF_BUCKET: ${{ matrix.bucket.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Differential suite, GC-every-${{ matrix.bucket.gcn }}, bucket ${{ matrix.bucket.name }}
        # --nocapture: libtest swallows the per-fixture PASS stream on
        # success, so a cap-kill leg shows nothing about which fixture was
        # in flight (CI #59 diagnosis needed the zip + API archaeology).
        # Streaming it costs ~92 eprintln lines and makes every future
        # gate-9 timeout self-diagnosing.
        run: cargo test --release -p j2r-cli --test diff_suite --locked -- --nocapture

  concurrency:
    name: gate-13-concurrency
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A red seed is evidence, not noise — keep every leg's verdict.
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 11]
    env:
      # Coop mode with a pinned rotation seed (J2R_SCHED_SEED feeds
      # apply_coop_seed at main-thread registration): each leg re-runs
      # the ten thread fixtures differentially vs Temurin under a
      # DIFFERENT deterministic schedule — output must stay byte-
      # identical (the coop scheduler changes interleaving, never
      # semantics). The job cap is the plan's per-seed timeout: an
      # overrunning seed fails loudly instead of hanging.
      J2R_SCHED: coop
      J2R_SCHED_SEED: ${{ matrix.seed }}
      J2R_DIFF_FIXTURES: ThreadHello,ThreadSafepoint,WaitNotify,MonitorContention,WaitTimeout,InterruptSleep,InterruptJoin,InterruptWait,DaemonExit,DaemonInterrupt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Coop differential fixtures, seed ${{ matrix.seed }}
        run: cargo test --release -p j2r-cli --test diff_suite --locked -- --nocapture
      - name: Concurrency stress — coop rounds + free-running chaos (loud deadlines)
        # The stress tests carry their own per-round deadlines (a lost
        # wakeup or a ring stall is a loud failure in seconds, never a
        # CI hang); the chaos knob (J2R_CHAOS_US-class randomized
        # micro-delays at the protocol seams) is the local stand-in for
        # CI's slow scheduler — the exact instrument that found and
        # pinned the T17 turn-grant + monitor-wait races.
        run: cargo test --release -p j2r-runtime --locked -- stress_ --nocapture

  no-unsafe:
    name: gate-10-no-unsafe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: No unsafe outside the audited FFI core (forbid + grep evidence)
        run: |
          cargo build --workspace --locked
          # forbid(unsafe_code) in every crate root except j2r-jni-ffi makes
          # any unsafe item a compile error; the grep documents the evidence.
          # THE ONE EXCEPTION (docs/M5_JNI_FFI.md §3, T09): the audited FFI
          # primitive core `crates/j2r-jni-ffi/src/ffi.rs`. Its unsafe
          # occurrence count is PINNED below — drift fails loudly, the gate
          # FAILS if the exception file disappears (an explicit allowlist
          # entry, never a blind spot), and any other crate gaining so much
          # as one unsafe fails.
          if rg -n 'unsafe\s*(fn|impl|trait|\{)' crates/ -g '!crates/j2r-jni-ffi/src/ffi.rs'; then
            echo "unsafe code outside the audited FFI core"; exit 1
          fi
          test -f crates/j2r-jni-ffi/src/ffi.rs || { echo "audited FFI core missing — allowlist entry is explicit"; exit 1; }
          count=$(rg -o 'unsafe\s*(fn|impl|trait|\{)' crates/j2r-jni-ffi/src/ffi.rs | wc -l)
          echo "audited unsafe occurrences in j2r-jni-ffi/src/ffi.rs: $count (pin: <= 12)"
          [ "$count" -le 12 ] || { echo "unsafe count exceeds the audited pin (M5_JNI_FFI.md §3)"; exit 1; }
          echo "zero unsafe outside the audited FFI core: confirmed"

  doc-counts:
    name: gate-11-doc-counts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: README/doc counts match the repository (audit A8)
        run: |
          cargo test --workspace --locked -- --list > /dev/null
          python3 scripts/check_doc_counts.py

  seams:
    name: gate-12-runtime-seams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every thread_local! seam is annotated (M4_PLAN §2 R3, all crates)
        run: python3 scripts/check_seams.py

  supply-chain:
    name: gate-17-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny — licenses, duplicate versions, source pinning, advisories (deny.toml)
        run: cargo deny --locked check licenses bans sources advisories
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actions-security:
    name: gate-18-actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # zizmor-action publishes its findings as SARIF to the Security tab
    # (same model as gates 14/15/16), which needs security-events: write
    # on THIS job only — the workflow-level contents: read stays minimal
    # everywhere else (same lesson as gate-16's 7bb7a8d fix).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: zizmor — GitHub Actions security audit (all five workflows)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      - name: actionlint — workflow syntax, semantics, shell fragments
        uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62 # v1.7.9

  doc-links:
    name: gate-19-doc-links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every local markdown link and anchor resolves (selftest runs first)
        run: |
          python3 scripts/check_doc_links.py --selftest
          python3 scripts/check_doc_links.py

  code-integrity:
    name: gate-20-code-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: No stubs, elision markers or FIXME tokens in crates/ (selftest runs first)
        run: |
          python3 scripts/check_stubs.py --selftest
          python3 scripts/check_stubs.py

  dependency-hygiene:
    name: gate-21-dependency-hygiene-advisory
    # ADVISORY by design: cargo-machete is grep-based and can miss
    # macro-only usage, so this gate reports and never blocks. If it
    # stays green and the owner decides the signal is real, promotion
    # to blocking is a one-line change with evidence.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo-machete — unused dependency report
        run: cargo-machete

  jni-parity:
    name: gate-22-jni-c-harness-parity
    # T13 13d / REVIEW_CHECKLIST G1.5: the dedicated JNI evidence gate.
    # Compiles the ONE harness .so with cc (ubuntu-latest has it), runs
    # BOTH runtimes (Temurin via System.loadLibrary; the j2r binary via
    # the 13c loading story), and asserts the three channels RAW-
    # identical — including the 13d attach-lifecycle pthread battery.
    # The test itself skips LOUDLY when no JDK or no C compiler is
    # present (the soe_e2e law), but this image has both, so a real run
    # is the expected shape — a skip here is a loud CI-visible anomaly,
    # not a silent green.
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: The ONE C harness — three-channel parity vs Temurin, both runtimes
        run: cargo test -p j2r-cli --test jni_parity --locked

  jmm-boundary:
    name: gate-23-jmm-boundary
    # REVIEW_CHECKLIST G4.2 arm (b): the memory-model boundary is
    # ENFORCED, not just documented. Compiles the committed JmmBoundary
    # fixture (volatile static, volatile instance, final instance,
    # folded static final, plain field) with javac, runs j2r compile,
    # and scripts/check_jmm_boundary.py fails loudly unless (a) the
    # emitted src/jmm_boundary.rs sidecar lists EXACTLY the boundary
    # fields the input bytecode flags name, and (b) every access site
    # in src/classes carries the J2R-JMM-BOUNDARY marker while plain
    # fields and folded constants carry none. The generated crate is
    # then built and its output compared to Temurin so the marker
    # plumbing provably did not change behavior (expected 52/3/7/42).
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Build j2r
        run: cargo build --release --locked
      - name: javac the fixture
        run: |
          javac -d "$RUNNER_TEMP/jmm-st" crates/j2r-cli/tests/jmm/JmmBoundary.java
      - name: j2r compile the fixture
        run: |
          ./target/release/j2r compile --classpath "$RUNNER_TEMP/jmm-st" \
            --main-class JmmBoundary --crate-name jmm_app \
            -o "$RUNNER_TEMP/jmm-out"
      - name: Enforce the boundary (checker)
        run: |
          python3 scripts/check_jmm_boundary.py \
            --classes "$RUNNER_TEMP/jmm-st" --out "$RUNNER_TEMP/jmm-out"
      - name: The marked crate still behaves identically (three-channel)
        run: |
          cargo build --release --offline -j 2 \
            --manifest-path "$RUNNER_TEMP/jmm-out/Cargo.toml"
          BIN=$(find "$RUNNER_TEMP/jmm-out/target/release" -maxdepth 1 -type f -perm -111 -name "jmm_app")
          "$BIN" > "$RUNNER_TEMP/jmm-rust.out" 2> "$RUNNER_TEMP/jmm-rust.err"
          RC=$?
          java -cp "$RUNNER_TEMP/jmm-st" JmmBoundary > "$RUNNER_TEMP/jmm-java.out" 2> "$RUNNER_TEMP/jmm-java.err"
          RJ=$?
          diff "$RUNNER_TEMP/jmm-rust.out" "$RUNNER_TEMP/jmm-java.out"
          diff "$RUNNER_TEMP/jmm-rust.err" "$RUNNER_TEMP/jmm-java.err"
          test "$RC" = "$RJ"

  all-gates:
    name: gate-8-all-gates-green
    # On prose-only PRs the five heavy legs above are skipped by the path
    # filter, and default needs-semantics then skip this aggregate too —
    # intentional: a PR that cannot change behaviour carries no runtime
    # evidence. Pushes to main always run every leg, so every main run
    # keeps the full aggregate (the evidence chain).
    needs: [fmt, clippy, test, build-release, standalone, doc, security, gc-stress, no-unsafe, doc-counts, seams, concurrency, supply-chain, actions-security, doc-links, code-integrity, jni-parity, jmm-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        run: echo "All 18 upstream gates are green."
