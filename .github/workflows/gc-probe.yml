# gc-probe — one-shot CI diagnostic (ops tooling, NOT a gate).
#
# WHY: CI #59 (7bb7a8d) showed gate-9 legs of 14m / 1m / >=120m / 1m /
# 1m / >=120m while the same tree runs the whole 89-fixture suite at
# J2R_GC_EVERY_N=1 locally in ~15 minutes (measured per fixture:
# scripts/gc_weights.csv — ReflectGC >=540s, everything else <=9.4s).
# Local reproduction of leg 2's exact shard (stride 2/6, release, N=1)
# finishes in 86s, so the >=120m CI legs are NOT a CPU-speed effect —
# something CI-specific (scheduler timing on 2-vCPU runners?) makes
# specific fixtures burn the cap. libtest swallows the per-fixture PASS
# stream on success, so the 120m legs' logs show nothing about which
# fixture was in flight.
#
# This workflow runs each suspect SOLO on the real CI environment with
# --nocapture and a 15-minute inner timeout. A leg that dies red = that
# fixture is the bomb; the log's PASS stream and the job wall time give
# the CI weight directly. Dispatch manually, read the job list, delete
# or keep the file (keep: it is the standing CI-side probe for the next
# weight recalibration).
#
# Not a gate: never required, never in the gate-8 aggregate, no branch
# protection reference. permissions are read-only; no secrets.

name: gc-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - ReflectGC
          - BigJson
          - BigCache
          - Cycles
          - LambdaGC
          - MonitorContention
          - WaitNotify
    env:
      J2R_GC_EVERY_N: '1'
      J2R_DIFF_FIXTURES: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Solo probe — ${{ matrix.fixture }} at a collection every allocation
        # Inner timeout keeps a livelocked fixture from eating the whole
        # 20-minute job cap: exit 124 marks the fixture as the bomb while
        # the --nocapture PASS stream stays in the log.
        run: |
          echo "probing ${{ matrix.fixture }} solo (inner timeout 900s)"
          timeout 900 cargo test --release -p j2r-cli --test diff_suite --locked -- --nocapture
