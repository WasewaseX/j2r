# gate-14 CodeQL query configuration (see .github/workflows/codeql.yml).
#
# Query selection lives here, not in the workflow: when a config-file is
# set, the action takes the `queries` list from this file.
#
#   * security-extended      — the extended security suite (extra CWE
#                              breadth over the default suite).
#   * security-and-quality   — adds the maintainability/reliability
#                              quality queries on top.
#   * ./analysis/codeql/*.ql — J2R project invariant tripwires, locally
#                              validated with CodeQL CLI 2.27.4 (clean
#                              compile; positive controls fire on a
#                              known-bad fixture database; zero findings
#                              on the repository database).

name: "J2R CodeQL configuration"

queries:
  - uses: security-extended
  - uses: security-and-quality
  - uses: ./analysis/codeql/UnsafeCode.ql
  - uses: ./analysis/codeql/StdoutPrint.ql
