[package]
name = "j2r-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Java-semantics runtime used by programs generated by the J2R Java-to-Rust compiler"
repository = "https://github.com/WasewaseX/j2r"

[dependencies]
# The audited FFI primitive crate — the workspace's single scoped unsafe
# exception (docs/M5_JNI_FFI.md). Internal path dep, NOT an external one:
# the zero-external-dependencies law is untouched.
j2r-jni-ffi = { path = "../j2r-jni-ffi" }
